<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - TRAERSA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="video-background">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="/Video/AdminiStrador.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
    </div>

    <div class="decoration-line line-left"></div>
    <div class="decoration-line line-right"></div>

    <a href="index.html" class="btn-volver">VOLVER</a>

    <main class="login-card">
        <h2>RECUPERAR CONTRASEÑA</h2>
        
        <p style="font-size: 13px; margin-bottom: 20px; font-weight: bold; color: #ccc;">
            Introduce tu correo electrónico para enviarte las instrucciones de restablecimiento.
        </p>

        <form id="recoverForm">
            <div class="input-group">
                <label>Correo Electrónico</label>
                <div class="input-field">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="recoverEmail" placeholder="Correo Electrónico" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">ENVIAR INSTRUCCIONES</button>

            <p class="footer-form">¿Recordaste tu clave? <a href="Inicio_sesion.html">Inicia sesión.</a></p>
        </form>
    </main>

    <footer class="main-footer">© TRAERSA</footer>

    <script src="script.js"></script>
</body>
</html>
